apiVersion: v1
kind: Service
metadata:
  name: {{ include "wire-codec.fullname" . }}
  labels:
    {{- include "wire-codec.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: wire
      port: {{ .Values.service.port }}
      targetPort: wire
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "wire-codec.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
